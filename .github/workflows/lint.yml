# .github/workflows/lint.yml
# 作用：push 时自动 prettier 格式化 + 运行测试套件（冒烟/YAML/ES2020/QuickJS）+ 有变化自动提交回仓库
# 触发：push 到 main 分支（脚本/生成器/测试/格式配置改动时），PR，手动触发
name: 脚本自检与 YAML 自动同步

on:
  push:
    branches: [main]
    paths:
      - 'Mihomo-Script-Rules.js' # 覆写脚本本身
      - 'scripts/generate-yaml.cjs' # YAML 生成器
      - 'Test/**' # 测试套件
      - '.prettierrc*' # 格式配置
  pull_request:
    branches: [main]
    paths:
      - 'Mihomo-Script-Rules.js'
      - 'scripts/generate-yaml.cjs'
      - 'Test/**'
      - '.prettierrc*'
  workflow_dispatch: {} # 手动触发

# 同一分支的并发 run 只保留最新，避免格式化/同步提交互相冲突
concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许 Actions 提交回仓库
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整历史才能正确提交

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 prettier
        run: npm install -g prettier

      - name: 格式化 js / cjs / yml / yaml
        run: git ls-files -z '*.js' '*.cjs' '*.yml' '*.yaml' | xargs -0 -r prettier --write

      - name: 有变化则自动提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "无需格式化，跳过提交"
          else
            echo "格式化有变化，自动提交"
            git commit -m "chore: auto format [skip ci]"
            git push
          fi

  test:
    needs: format
    if: always() && (needs.format.result == 'success' || needs.format.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 拉取 format job 的提交（若有）
        run: git pull --ff-only

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装测试依赖（espree / quickjs-emscripten）
        run: npm --prefix Test install

      - name: 运行测试套件（冒烟 + YAML + ES2020 + QuickJS）
        run: node Test/run-tests.js

      - name: 检查 yaml 是否有变化，有则自动提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet mihomoConfig.yaml; then
            echo "yaml 无变化，跳过提交"
          else
            echo "yaml 有变化，自动提交"
            git add mihomoConfig.yaml
            git commit -m "chore: 自动同步 mihomoConfig.yaml [skip ci]"
            git push
          fi
