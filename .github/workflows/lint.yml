name: 脚本自检与 YAML 自动同步

on:
  push:
    branches: [main]
    paths:
      - 'Mihomo-Script-Rules.js'
      - 'scripts/generate-yaml.cjs'
      - 'Test/**'
      - '.prettierrc*'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'Mihomo-Script-Rules.js'
      - 'scripts/generate-yaml.cjs'
      - 'Test/**'
      - '.prettierrc*'
      - '.github/workflows/**'
  workflow_dispatch: {}

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 prettier
        run: npm install -g prettier

      - name: 格式化 js / cjs / yml / yaml
        run: git ls-files -z '*.js' '*.cjs' '*.yml' '*.yaml' | xargs -0 -r prettier --write

      - name: 有变化则自动提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "无需格式化，跳过提交"
          else
            echo "格式化有变化，自动提交"
            git commit -m "chore: auto format [skip ci]"
            git push origin HEAD:main
          fi

  test:
    needs: format
    if: always() && (needs.format.result == 'success' || needs.format.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 拉取 format job 的提交（push 事件）
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          git checkout --detach origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装测试依赖（espree / quickjs-emscripten）
        run: npm --prefix Test install

      - name: 运行测试套件（冒烟 + YAML + ES2020 + QuickJS）
        run: node Test/run-tests.js

      - name: 检查 yaml 是否有变化，有则自动提交（push 事件）
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet mihomoConfig.yaml; then
            echo "yaml 无变化，跳过提交"
          else
            echo "yaml 有变化，自动提交"
            git add mihomoConfig.yaml
            git commit -m "chore: 自动同步 mihomoConfig.yaml [skip ci]"
            git push origin HEAD:main
          fi
