name: 脚本自检

on:
  push:
    branches: [main]
    paths:
      - 'Mihomo-Script-Rules.js'
      - 'Test/**'
      - '.prettierrc*'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'Mihomo-Script-Rules.js'
      - 'Test/**'
      - '.prettierrc*'
      - '.github/workflows/**'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Test/package-lock.json

      - name: 格式化 js / cjs / yml（版本锁定，覆盖全部子目录）
        run: git ls-files -z '*.js' '*.cjs' '*.yml' | xargs -0 -r npx --yes prettier@3.3.3 --write

      - name: 格式化有变化则自动提交（push 事件，带冲突重试）
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "无需格式化，跳过提交"
            exit 0
          fi
          echo "格式化有变化，自动提交"
          git commit -m "chore: auto format [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "推送成功"
              exit 0
            fi
            echo "推送失败(第 $i 次)，rebase 后重试..."
            git pull --rebase --autostash origin main || { echo "rebase 失败，放弃"; exit 1; }
          done
          echo "重试 5 次仍失败"
          exit 1

      - name: 安装测试依赖（espree / quickjs-emscripten，锁文件确定性安装）
        run: npm --prefix Test ci

      - name: 运行测试套件（冒烟 + ES2020 + QuickJS）
        run: node Test/run-tests.js
