name: 同步fakeip-filter为MRS

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-fakeip
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: 下载 mihomo 预编译二进制 (linux amd64)
        run: |
          curl -fsSL -o /tmp/mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.30/mihomo-linux-amd64-v1.19.30.gz"
          gunzip -f /tmp/mihomo.gz
          chmod +x /tmp/mihomo
          /tmp/mihomo -v

      - name: 下载 ShellCrash 源头 fake_ip_filter.list
        run: |
          curl -fsSL --max-time 120 -o /tmp/fake_ip_filter.list \
            "https://raw.githubusercontent.com/juewuy/ShellCrash/dev/public/fake_ip_filter.list"
          LINES=$(grep -v '^#' /tmp/fake_ip_filter.list | grep -v '^$' | wc -l)
          echo "源列表条目数: $LINES"
          test "$LINES" -gt 100 || { echo "条目数异常,中止"; exit 1; }
          echo "LINES=$LINES" >> "$GITHUB_ENV"

      - name: 转换为 mrs
        run: |
          /tmp/mihomo convert-ruleset domain text /tmp/fake_ip_filter.list fakeip-filter.mrs
          ls -la fakeip-filter.mrs

      - name: 无变化则跳过,否则提交推送
        run: |
          if git diff --quiet -- fakeip-filter.mrs 2>/dev/null; then
            echo "fakeip-filter.mrs 无变化,跳过提交"
            exit 0
          fi
          git config user.name "fakeip-sync-bot"
          git config user.email "fakeip-sync-bot@users.noreply.github.com"
          git add fakeip-filter.mrs
          git commit -m "chore: 同步 ShellCrash fakeip-filter ($(date -u '+%Y-%m-%d'), $LINES 条) [skip ci]"
          git push

      - name: 同步失败告警（失败时创建/更新 Issue）
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const label = 'sync-fakeip';
            const title = '⚠️ fakeip-filter 规则同步失败';
            async function findOpen() {
              const { data: list } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: label,
              });
              return list.find((i) => i.title.includes('规则同步失败'));
            }
            const existing = await findOpen();
            const body =
              'fakeip-filter 规则同步 workflow 执行失败，请查看运行日志：\n' +
              'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId +
              '\n\n> 此 Issue 由 GitHub Actions 自动创建，同步恢复后自动关闭。';
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'open',
                body,
              });
              console.log('⚠️ 更新同步失败 Issue #' + existing.number);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label, 'auto-generated'],
              });
              console.log('⚠️ 新建同步失败 Issue');
            }

      - name: 同步成功自动关闭告警 Issue
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const { data: list } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-fakeip',
            });
            const existing = list.find((i) => i.title.includes('规则同步失败'));
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              });
              console.log('✅ 同步恢复，自动关闭 Issue #' + existing.number);
            } else {
              console.log('✅ 同步正常，无告警 Issue');
            }
