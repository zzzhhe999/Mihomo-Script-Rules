# ============================================================
# 每日自动同步 ShellCrash fake_ip_filter 源头 → mrs → 提交回本仓库
# 源头:   juewuy/ShellCrash (13k+ star, 社区事实标准)
#         https://raw.githubusercontent.com/juewuy/ShellCrash/dev/public/fake_ip_filter.list
# 产物:   仓库根目录 fakeip-filter.mrs (可直接用 jsdelivr 引用)
# 说明:   原 wwqgtxx/clash-rules 的 fakeip-filter 即此源头镜像,
#         本 workflow 直接对接源头, 绕过中间镜像
# 用法:   仓库 Settings → Actions → General
#         允许 "Workflow permissions: Read and write"
# ============================================================
name: Sync fakeip-filter to MRS

on:
  schedule:
    - cron: '0 4 * * *' # 每天 04:00 UTC (北京 12:00), 避开 anti-AD 的 03:30
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

concurrency:
  group: sync-fakeip
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: 下载 mihomo 预编译二进制 (linux amd64)
        run: |
          curl -fsSL -o /tmp/mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.30/mihomo-linux-amd64-v1.19.30.gz"
          gunzip -f /tmp/mihomo.gz
          chmod +x /tmp/mihomo
          /tmp/mihomo -v

      - name: 下载 ShellCrash 源头 fake_ip_filter.list
        run: |
          curl -fsSL --max-time 120 -o /tmp/fake_ip_filter.list \
            "https://raw.githubusercontent.com/juewuy/ShellCrash/dev/public/fake_ip_filter.list"
          LINES=$(grep -v '^#' /tmp/fake_ip_filter.list | grep -v '^$' | wc -l)
          echo "源列表条目数: $LINES"
          test "$LINES" -gt 100 || { echo "条目数异常,中止"; exit 1; }
          echo "LINES=$LINES" >> "$GITHUB_ENV"

      - name: 转换为 mrs
        run: |
          /tmp/mihomo convert-ruleset domain text /tmp/fake_ip_filter.list fakeip-filter.mrs
          ls -la fakeip-filter.mrs

      - name: 无变化则跳过,否则提交推送
        run: |
          if git diff --quiet -- fakeip-filter.mrs 2>/dev/null; then
            echo "fakeip-filter.mrs 无变化,跳过提交"
            exit 0
          fi
          git config user.name "fakeip-sync-bot"
          git config user.email "fakeip-sync-bot@users.noreply.github.com"
          git add fakeip-filter.mrs
          git commit -m "chore: 同步 ShellCrash fakeip-filter ($(date -u '+%Y-%m-%d'), $LINES 条) [skip ci]"
          git push
