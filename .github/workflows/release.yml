name: 自动发布 Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Test/package-lock.json

      - name: 语法检查
        run: node --check Mihomo-Script-Rules.js

      - name: 安装测试依赖（确定性）
        run: npm --prefix Test ci

      - name: 运行测试套件（确保发布代码必然通过）
        run: node Test/run-tests.js

      - name: 打包附件
        run: |
          mkdir -p release
          cp Mihomo-Script-Rules.js release/
          cd release && zip Mihomo-Script-Rules-${{ github.ref_name }}.zip Mihomo-Script-Rules.js && cd ..
          ls -la release/

      - name: 生成校验和
        run: |
          cd release
          sha256sum Mihomo-Script-Rules.js Mihomo-Script-Rules-${{ github.ref_name }}.zip > SHA256SUMS
          cat SHA256SUMS

      - name: 更新 GitHub Release 附件与说明
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          name: ${{ github.ref_name }}
          body: |
            ${{ github.event.release.body }}

            ## 附件说明
            - **Mihomo-Script-Rules.js** — 覆写脚本，在代理客户端中导入
            - **Mihomo-Script-Rules-${{ github.ref_name }}.zip** — 脚本文件打包
            - **SHA256SUMS** — 全部附件的 SHA-256 校验和

            ## 使用方法
            复制 [raw 链接](https://raw.githubusercontent.com/${{ github.repository }}/main/Mihomo-Script-Rules.js)，在客户端脚本功能中导入

            > 完整文档见 [README](https://github.com/${{ github.repository }}#readme)
          files: |
            release/Mihomo-Script-Rules.js
            release/Mihomo-Script-Rules-${{ github.ref_name }}.zip
            release/SHA256SUMS
