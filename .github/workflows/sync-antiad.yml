name: 同步anti-AD为MRS

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-antiad
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: 下载 mihomo 预编译二进制 (linux amd64)
        run: |
          curl -fsSL -o /tmp/mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.30/mihomo-linux-amd64-v1.19.30.gz"
          gunzip -f /tmp/mihomo.gz
          chmod +x /tmp/mihomo
          /tmp/mihomo -v

      - name: 下载 anti-AD yaml
        run: |
          curl -fsSL --max-time 120 -o /tmp/anti-ad-clash.yaml \
            "https://fastly.jsdelivr.net/gh/privacy-protection-tools/anti-AD@master/anti-ad-clash.yaml" \
            || curl -fsSL --max-time 120 -o /tmp/anti-ad-clash.yaml \
            "https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/master/anti-ad-clash.yaml"
          LINES=$(grep -c '^  - ' /tmp/anti-ad-clash.yaml)
          echo "anti-AD 条目数: $LINES"
          test "$LINES" -gt 10000 || { echo "条目数异常,中止"; exit 1; }

      - name: 转换为 mrs
        run: |
          /tmp/mihomo convert-ruleset domain yaml /tmp/anti-ad-clash.yaml anti-ad.mrs
          ls -la anti-ad.mrs

      - name: 无变化则跳过,否则提交推送
        run: |
          if git diff --quiet -- anti-ad.mrs 2>/dev/null; then
            echo "anti-ad.mrs 无变化,跳过提交"
            exit 0
          fi
          git config user.name "antiad-sync-bot"
          git config user.email "antiad-sync-bot@users.noreply.github.com"
          git add anti-ad.mrs
          git commit -m "chore: 同步 anti-AD 规则 ($(date -u '+%Y-%m-%d')) [skip ci]"
          git push

      - name: 同步失败告警（失败时创建/更新 Issue）
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const label = 'sync-antiad';
            const title = '⚠️ anti-AD 规则同步失败';
            async function findOpen() {
              const { data: list } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: label,
              });
              return list.find((i) => i.title.includes('规则同步失败'));
            }
            const existing = await findOpen();
            const body =
              'anti-AD 规则同步 workflow 执行失败，请查看运行日志：\n' +
              'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId +
              '\n\n> 此 Issue 由 GitHub Actions 自动创建，同步恢复后自动关闭。';
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'open',
                body,
              });
              console.log('⚠️ 更新同步失败 Issue #' + existing.number);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label, 'auto-generated'],
              });
              console.log('⚠️ 新建同步失败 Issue');
            }

      - name: 同步成功自动关闭告警 Issue
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const { data: list } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-antiad',
            });
            const existing = list.find((i) => i.title.includes('规则同步失败'));
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              });
              console.log('✅ 同步恢复，自动关闭 Issue #' + existing.number);
            } else {
              console.log('✅ 同步正常，无告警 Issue');
            }
